# ============================================================
# ActivityLens – Configuration
# ============================================================

capture:
  polling_interval_seconds: 5        # How often to poll the active window
  idle_threshold_seconds: 300        # 5 min — used by Day 2 sessionizer

privacy:
  # Apps/titles that are NEVER captured. Supports:
  #   - Exact process names (case-insensitive): "1Password.exe"
  #   - Glob patterns on window titles: "*bank*", "*health*"
  blocklist:
    process_names:
      - "1Password.exe"
      - "KeePass.exe"
      - "Bitwarden.exe"
    title_patterns:
      - "*bank*"
      - "*health*"
      - "*medical*"
      - "*password*"

  retention_days: 30                 # Auto-delete raw snapshots older than this

classification:
  productive:
    processes:
      - "Code.exe"
      - "devenv.exe"
      - "WindowsTerminal.exe"
      - "cmd.exe"
      - "powershell.exe"
    browser_titles:
      - "*stackoverflow*"
      - "*stack overflow*"
      - "*github*"
      - "*docs.*"
      - "*documentation*"
      - "*api*"
  distracting:
    processes: []
    browser_titles:
      - "*youtube*"
      - "*reddit*"
      - "*twitter*"
      - "*x.com*"
      - "*instagram*"
      - "*facebook*"
      - "*tiktok*"

dashboard:
  host: "127.0.0.1"
  port: 5000

handoff:
  ignore_dirs:
    - "node_modules"
    - ".git"
    - "__pycache__"
    - "venv"
    - ".venv"
    - "dist"
    - "build"
    - ".next"
    - ".pytest_cache"
    - ".mypy_cache"
    - ".tox"
    - "egg-info"
  ignore_extensions:
    - ".pyc"
    - ".pyo"
    - ".exe"
    - ".dll"
    - ".so"
    - ".o"
    - ".a"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".gif"
    - ".ico"
    - ".svg"
    - ".woff"
    - ".woff2"
    - ".ttf"
    - ".eot"
    - ".lock"
    - ".map"
    - ".min.js"
    - ".min.css"
  max_file_lines: 300
  max_files: 15

storage:
  db_path: "data/activity.db"        # Relative to project root
